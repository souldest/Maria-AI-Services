name: Azure ACR Build & Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS3 }}

      # 3. Build & Push Frontend Docker Image zu ACR
      - name: Build and push Docker image
        uses: azure/docker-login@v1
        with:
          login-server: mariaairegistry001.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -f frontend/Dockerfile -t mariaairegistry001.azurecr.io/frontend:latest frontend
          docker push mariaairegistry001.azurecr.io/frontend:latest

      # 4. Azure Container App erstellen oder aktualisieren
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            -n maria-frontend-app \
            -g maria-ai-service-001_group \
            --image mariaairegistry001.azurecr.io/frontend:latest \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 1 \
            --max-replicas 2 \
            --ingress external \
            --target-port 8501
