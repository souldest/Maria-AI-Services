name: Azure Container Registry Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Schritt 0: Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v3

      # Schritt 1: Azure Login mit dem Secret
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Schritt 2: Login zu Azure Container Registry
      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      # Schritt 3: Docker-Image bauen
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/maria-ai:latest .

      # Schritt 4: Docker-Image pushen
      - name: Push Docker Image to ACR
        run: |
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/maria-ai:latest

      # Optional Schritt 5: Container auf Azure Container Instance / Web App deployen
