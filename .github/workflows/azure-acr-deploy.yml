name: Build & Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # 1️⃣ Checkout code
      # ------------------------------
      - uses: actions/checkout@v3

      # ------------------------------
      # 2️⃣ Azure Login
      # ------------------------------
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ------------------------------
      # 3️⃣ Build & Push Docker Image to ACR
      # ------------------------------
      - name: Build and Push Docker Image
        run: |
          az acr login --name ${{ secrets.AZURE_ACR_NAME }}
          docker build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/maria-ai:latest .
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/maria-ai:latest

      # ------------------------------
      # 4️⃣ Deploy to Azure Container App
      # ------------------------------
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name maria-ai-app \
            --resource-group maria-ai-service-001_group \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/maria-ai:latest \
            --cpu 0.5 --memory 1.0Gi
