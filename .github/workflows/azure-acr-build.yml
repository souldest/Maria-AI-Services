name: Build and Push Backend Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Schritt 0: Repository auschecken
    - uses: actions/checkout@v3

    # Schritt 1: Azure Login mit Secret
    - uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS4 }}

    # Schritt 2: Login zu Azure Container Registry
    - name: Login to Azure Container Registry
      run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

    # Schritt 3: Docker Build
    - name: Build Backend Docker Image
      run: |
        docker build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/backend:latest ./backend

    # Schritt 4: Docker Push
    - name: Push Backend Docker Image
      run: |
        docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/backend:latest
