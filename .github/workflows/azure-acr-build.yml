name: Build & Deploy Backend to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login via Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS4 }}

      - name: Build & Push Docker image
        uses: azure/docker-login@v1
        with:
          login-server: mariaairegistry001.azurecr.io
          username: ${{ secrets.AZURE_CREDENTIALS4_USERNAME }}
          password: ${{ secrets.AZURE_CREDENTIALS4_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -f backend/Dockerfile -t mariaairegistry001.azurecr.io/maria-ai-backend:latest backend
          docker push mariaairegistry001.azurecr.io/maria-ai-backend:latest

      - name: Deploy Backend to Azure Container App
        run: |
          az containerapp update \
            --name maria-ai-app \
            --resource-group maria-ai-service-001_group \
            --image mariaairegistry001.azurecr.io/maria-ai-backend:latest \
            --cpu 1 --memory 1.5Gi \
            --min-replicas 1 --max-replicas 2
