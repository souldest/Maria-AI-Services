name: Build and Deploy Backend to Azure Container Apps

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # Azure Login via Service Principal
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Login to Azure Container Registry
    - name: ACR Login
      uses: azure/docker-login@v1
      with:
        login-server: mariaairegistry001.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # Build Backend Image and push to ACR
    - name: Build and Push Backend Image
      run: |
        docker build -f backend/Dockerfile -t mariaairegistry001.azurecr.io/meinimage:latest ./backend
        docker push mariaairegistry001.azurecr.io/meinimage:latest

    # Deploy to Azure Container Apps
    - name: Deploy Backend to Azure Container Apps
      run: |
        az containerapp update \
          -n maria-ai-app \
          -g maria-ai-service-001_group \
          --image mariaairegistry001.azurecr.io/meinimage:latest
