name: Deploy forecast_agent updates

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      ACR_NAME: mariaairegistry001
      BACKEND_APP: forecast-backend-app
      FRONTEND_APP: forecast-frontend-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login $ACR_NAME.azurecr.io -u $ACR_NAME --password-stdin

      - name: Build Backend Docker Image
        run: |
          docker build -t $ACR_NAME.azurecr.io/$BACKEND_APP:latest -f ./Dockerfile ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t $ACR_NAME.azurecr.io/$FRONTEND_APP:latest -f ./Dockerfile ./frontend

      - name: Push Backend Image to ACR
        run: |
          docker push $ACR_NAME.azurecr.io/$BACKEND_APP:latest

      - name: Push Frontend Image to ACR
        run: |
          docker push $ACR_NAME.azurecr.io/$FRONTEND_APP:latest

      - name: Deploy Backend Container App
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group maria-ai-service-001_group \
            --image $ACR_NAME.azurecr.io/$BACKEND_APP:latest \
            --environment maria-ai-env

      - name: Deploy Frontend Container App
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group maria-ai-service-001_group \
            --image $ACR_NAME.azurecr.io/$FRONTEND_APP:latest \
            --environment maria-ai-env
