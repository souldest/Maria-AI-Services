name: Deploy forecast_agent updates

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Azure CLI
      uses: azure/setup-azure@v3

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Enable Docker experimental features
      run: echo '{"experimental": "enabled"}' | sudo tee /etc/docker/daemon.json

    - name: Install Docker (if not available)
      run: sudo apt-get update && sudo apt-get install -y docker.io

    - name: Make deploy script executable
      run: chmod +x ./create-containerapps.sh

    - name: Run deploy script
      run: ./create-containerapps.sh
