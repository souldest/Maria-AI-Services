name: Build & Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          registry: mariaairegistry001.azurecr.io

      - name: Build and Push Backend Docker Image
        run: |
          docker build -t mariaairegistry001.azurecr.io/forecast-backend:latest ./backend
          docker push mariaairegistry001.azurecr.io/forecast-backend:latest

      - name: Build and Push Frontend Docker Image
        run: |
          docker build -t mariaairegistry001.azurecr.io/forecast-frontend:latest ./frontend
          docker push mariaairegistry001.azurecr.io/forecast-frontend:latest

      - name: Deploy Backend to Azure Container Apps
        run: |
          az containerapp update \
            --name forecast-backend-app \
            --resource-group maria-ai-service-001_group \
            --image mariaairegistry001.azurecr.io/forecast-backend:latest \
            --environment maria-ai-env

      - name: Deploy Frontend to Azure Container Apps
        run: |
          az containerapp update \
            --name forecast-frontend-app \
            --resource-group maria-ai-service-001_group \
            --image mariaairegistry001.azurecr.io/forecast-frontend:latest \
            --environment maria-ai-env
