name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Backend Image
        run: |
          cd backend
          docker build -t <ACR_NAME>.azurecr.io/agent-backend:latest .
          echo ${{ secrets.ACR_PASSWORD }} | docker login <ACR_NAME>.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
          docker push <ACR_NAME>.azurecr.io/agent-backend:latest

      - name: Deploy Backend to Azure Container App
        run: |
          az containerapp update --name agent-backend --resource-group <RESOURCE_GROUP> --image <ACR_NAME>.azurecr.io/agent-backend:latest --env-vars CREWAI_API_KEY=${{ secrets.CREWAI_API_KEY }}
