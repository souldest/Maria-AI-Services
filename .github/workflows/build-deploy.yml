name: Deploy Backend and Frontend to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  # 1. Docker Login
  docker-login:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: mariaaiacr001
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Docker Login (non-interactive)
        run: |
          echo $ACR_PASSWORD | docker login $ACR_NAME.azurecr.io -u $ACR_USERNAME --password-stdin

  # 2. Backend Build & Push
  build-backend:
    runs-on: ubuntu-latest
    needs: docker-login
    env:
      ACR_NAME: mariaaiacr001
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      - name: Build Backend Image
        run: |
          docker build -t $ACR_NAME.azurecr.io/agent-backend:latest -f backend/Dockerfile ./backend
          docker push $ACR_NAME.azurecr.io/agent-backend:latest

  # 3. Frontend Build & Push
  build-frontend:
    runs-on: ubuntu-latest
    needs: docker-login
    env:
      ACR_NAME: mariaaiacr001
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      - name: Build Frontend Image
        run: |
          docker build -t $ACR_NAME.azurecr.io/agent-frontend:latest -f frontend/Dockerfile ./frontend
          docker push $ACR_NAME.azurecr.io/agent-frontend:latest

  # 4. Backend Deployment
  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v3
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Backend
        run: |
          az containerapp create \
            --name agent-backend \
            --resource-group maria-ai-service-001_group \
            --environment maria-ai-env \
            --image $ACR_NAME.azurecr.io/agent-backend:latest \
            --cpu 0.5 \
            --memory 1Gi \
            --registry-login-server $ACR_NAME.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ingress external \
            --target-port 8002 \
            --environment-variables \
                PGHOST=${{ secrets.PGHOST }} \
                PGUSER=${{ secrets.PGUSER }} \
                PGPASSWORD=${{ secrets.PGPASSWORD }} \
                PGDATABASE=${{ secrets.PGDATABASE }} \
                PGPORT=${{ secrets.PGPORT }}

  # 5. Frontend Deployment
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build-frontend, deploy-backend]
    steps:
      - uses: actions/checkout@v3
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Frontend
        run: |
          az containerapp create \
            --name agent-frontend \
            --resource-group maria-ai-service-001_group \
            --environment maria-ai-env \
            --image $ACR_NAME.azurecr.io/agent-frontend:latest \
            --cpu 0.5 \
            --memory 1Gi \
            --registry-login-server $ACR_NAME.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ingress external \
            --target-port 8501 \
            --environment-variables \
                BACKEND_URL="https://agent-backend.${{ github.repository_owner }}.azurecontainerapps.io"
