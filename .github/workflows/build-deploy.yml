name: Deploy Backend and Frontend to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout des Codes
      - uses: actions/checkout@v3

      # Login zu Azure
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Build und Push Backend Image
      - name: Build and Push Backend Image
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login mariaaiacr001.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
          docker build -t mariaaiacr001.azurecr.io/agent-backend:latest ./backend
          docker push mariaaiacr001.azurecr.io/agent-backend:latest

      # Deploy Backend zu Azure Container Apps
      - name: Deploy Backend
        run: |
          az containerapp create \
            --name agent-backend \
            --resource-group maria-ai-service-001_group \
            --environment maria-ai-env \
            --image mariaaiacr001.azurecr.io/agent-backend:latest \
            --cpu 0.5 --memory 1Gi \
            --registry-login-server mariaaiacr001.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ingress external \
            --target-port 8000 \
            --environment-variables \
                CREWAI_API_KEY=${{ secrets.CREWAI_API_KEY }} \
                PGHOST=${{ secrets.PGHOST }} \
                PGUSER=${{ secrets.PGUSER }} \
                PGPASSWORD=${{ secrets.PGPASSWORD }} \
                PGDATABASE=${{ secrets.PGDATABASE }} \
                PGPORT=${{ secrets.PGPORT }}

      # Build und Push Frontend Image
      - name: Build and Push Frontend Image
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login mariaaiacr001.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
          docker build -t mariaaiacr001.azurecr.io/agent-frontend:latest ./frontend
          docker push mariaaiacr001.azurecr.io/agent-frontend:latest

      # Deploy Frontend zu Azure Container Apps
      - name: Deploy Frontend
        run: |
          az containerapp create \
            --name agent-frontend \
            --resource-group maria-ai-service-001_group \
            --environment maria-ai-env \
            --image mariaaiacr001.azurecr.io/agent-frontend:latest \
            --cpu 0.5 --memory 1Gi \
            --registry-login-server mariaaiacr001.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ingress external \
            --target-port 8501 \
            --environment-variables \
                BACKEND_URL="https://agent-backend.${{ github.repository_owner }}.azurecontainerapps.io"
