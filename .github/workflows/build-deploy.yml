name: Deploy Backend and Frontend to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  ACR_NAME: mariaaiacr001
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

jobs:
  # Docker Login Schritt (einmalig)
  docker-login:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.set-registry.outputs.registry }}
    steps:
      - uses: actions/checkout@v3

      - name: Docker Login
        id: set-registry
        run: |
          echo $ACR_PASSWORD | docker login $ACR_NAME.azurecr.io -u $ACR_USERNAME --password-stdin
          echo "registry=$ACR_NAME.azurecr.io" >> $GITHUB_OUTPUT

  # Backend Image bauen und pushen
  build-backend:
    runs-on: ubuntu-latest
    needs: docker-login
    steps:
      - uses: actions/checkout@v3
      - name: Build Backend Image
        run: |
          docker build -t $ACR_NAME.azurecr.io/agent-backend:latest -f backend/Dockerfile ./backend
          docker push $ACR_NAME.azurecr.io/agent-backend:latest

  # Frontend Image bauen und pushen
  build-frontend:
    runs-on: ubuntu-latest
    needs: docker-login
    steps:
      - uses: actions/checkout@v3
      - name: Build Frontend Image
        run: |
          docker build -t $ACR_NAME.azurecr.io/agent-frontend:latest -f frontend/Dockerfile ./frontend
          docker push $ACR_NAME.azurecr.io/agent-frontend:latest

  # Backend Deployment
  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v3
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Backend
        run: |
          az containerapp create \
            --name agent-backend \
            --resource-group maria-ai-service-001_group \
            --environment maria-ai-env \
            --image $ACR_NAME.azurecr.io/agent-backend:latest \
            --cpu 0.5 \
            --memory 1Gi \
            --registry-login-server $ACR_NAME.azurecr.io \
            --registry-username $ACR_USERNAME \
            --registry-password $ACR_PASSWORD \
            --ingress external \
            --target-port 8000 \
            --environment-variables \
                CREWAI_API_KEY=${{ secrets.CREWAI_API_KEY }} \
                PGHOST=${{ secrets.PGHOST }} \
                PGUSER=${{ secrets.PGUSER }} \
                PGPASSWORD=${{ secrets.PGPASSWORD }} \
                PGDATABASE=${{ secrets.PGDATABASE }} \
                PGPORT=${{ secrets.PGPORT }}

  # Frontend Deployment (nach Backend)
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build-frontend, deploy-backend]
    steps:
      - uses: actions/checkout@v3
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Frontend
        run: |
          az containerapp create \
            --name agent-frontend \
            --resource-group maria-ai-service-001_group \
            --environment maria-ai-env \
            --image $ACR_NAME.azurecr.io/agent-frontend:latest \
            --cpu 0.5 \
            --memory 1Gi \
            --registry-login-server $ACR_NAME.azurecr.io \
            --registry-username $ACR_USERNAME \
            --registry-password $ACR_PASSWORD \
            --ingress external \
            --target-port 8501 \
            --environment-variables \
                BACKEND_URL="https://agent-backend.${{ github.repository_owner }}.azurecontainerapps.io"
