name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker image
        run: docker build -t myregistry.azurecr.io/maria-ai-project:latest .

      - name: Push Docker image
        run: docker push myregistry.azurecr.io/maria-ai-project:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update --name maria-ai-containerapp \
            --resource-group myResourceGroup \
            --image myregistry.azurecr.io/maria-ai-project:latest
